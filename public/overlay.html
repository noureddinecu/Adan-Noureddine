<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Quiz Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="app" class="phase-idle">
  <header id="top">
    <div class="pill" id="cat"></div>
    <div class="pill" id="diff"></div>
    <div class="pill" id="count"></div>
  </header>
  <div id="timer"><div id="timerBar"></div><span id="timerText"></span></div>
  <main id="stage"></main>
  <aside id="board">
    <h3 id="boardTitle"></h3>
    <ol id="boardList"></ol>
  </aside>
  <div id="feed"></div>
</div>
<canvas id="confetti"></canvas>
<button id="soundBtn" hidden>🔊</button>
<script src="overlay.js"></script>
</body>
</html>
