plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.livequizgame.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.livequizgame.app'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"

        // nodejs-mobile ships 64-bit ARM (virtually every phone sold since 2017)
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    sourceSets {
        main { jniLibs.srcDirs = ['libnode/bin'] }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libnode.so', '**/libc++_shared.so']
        }
    }

    androidResources {
        // the server bundle is already compressed
        noCompress 'zip'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('LQG_KEYSTORE') ?: 'release.jks')
            storePassword System.getenv('LQG_STORE_PASSWORD') ?: project.property('lqgStorePassword')
            keyAlias System.getenv('LQG_KEY_ALIAS') ?: 'lqg'
            keyPassword System.getenv('LQG_KEY_PASSWORD') ?: project.property('lqgKeyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
