<title>سخّنها</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone game. HUD on top, frozen scene in the middle, free armoury along the bottom. */
:root{
  color-scheme: dark;
  --night:#0a1a31;      /* winter night ground */
  --panel:#12294a;      /* HUD and armoury surfaces */
  --line:#24487a;       /* panel edges */
  --ice:#bfe6ff;        /* frost blue */
  --snow:#f3f9ff;       /* text */
  --dim:#9bb8d8;        /* secondary text */
  --heat:#ff7a1a;       /* the one hot accent */
  --heat-2:#ffd23f;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--snow);font-family:var(--body);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  max-width:560px;margin:0 auto;box-sizing:border-box}

/* HUD */
#hud{display:flex;flex-direction:column;gap:6px}
#hudTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#lvlName{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--ice);min-width:0}
#net{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
#net.on{color:var(--heat-2)}
#bar{height:16px;border-radius:8px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
#barFill{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,var(--heat),var(--heat-2));border-radius:8px}
#barTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--snow);text-shadow:0 1px 2px #000a}
#players{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel);
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip b{color:var(--dim);font-weight:700}

/* Stage */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{touch-action:none;border-radius:14px;display:block;background:#1b3558;box-shadow:0 0 0 2px var(--line)}
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  pointer-events:none;text-align:center}
#banner h2{font-family:var(--display);font-weight:400;font-size:44px;margin:0;color:var(--heat-2);text-shadow:0 3px 0 #7a2d00,0 6px 18px #000a}
#banner p{margin:0;font-weight:800;font-size:16px;text-shadow:0 2px 6px #000c}

/* Armoury */
#shopHead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--dim)}
#shopHead strong{font-family:var(--display);font-weight:400;font-size:17px;color:var(--heat-2)}
#tools{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:78px;padding:6px 4px 7px;border-radius:12px;border:2px solid var(--line);background:var(--panel);
  color:var(--snow);font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tool .ic{font-size:26px;line-height:1.15}
.tool .nm{font-size:12px;font-weight:800;white-space:nowrap}
.tool .pr{font-size:11px;font-weight:700;color:var(--dim)}
.tool .pr s{opacity:.7}
.tool .pr em{font-style:normal;color:var(--heat-2)}
.tool[aria-pressed="true"]{border-color:var(--heat);background:#3a2413;box-shadow:0 0 14px #ff7a1a66}
.tool:focus-visible,.pick:focus-visible,#go:focus-visible,#nameIn:focus-visible{outline:3px solid var(--ice);outline-offset:2px}

/* Start card */
#start{position:fixed;inset:0;z-index:20;background:#061224ee;display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
#card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
#card h1{font-family:var(--display);font-weight:400;font-size:64px;line-height:1;margin:0;color:var(--heat-2);
  text-shadow:0 4px 0 #7a2d00;text-wrap:balance}
#card p{margin:0;color:var(--dim);font-weight:700;line-height:1.5}
.pick{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--snow);
  font-family:var(--display);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.pick i{width:14px;height:14px;border-radius:50%}
#other{display:flex;gap:8px}
#nameIn{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--night);
  color:var(--snow);font-family:var(--body);font-size:16px;font-weight:700}
#go{padding:10px 16px;border-radius:12px;border:0;background:var(--heat);color:#231000;font-family:var(--display);font-size:18px;cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  #banner h2{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
}
</style>

<div id="app" dir="rtl" lang="ar">
  <div id="hud">
    <div id="hudTop">
      <div id="lvlName">المرحلة 1</div>
      <div id="net">كتلعب بوحدك</div>
    </div>
    <div id="bar" role="progressbar" aria-label="شحال ذاب" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="barFill"></div><div id="barTxt">ذاب 0%</div>
    </div>
    <div id="players"></div>
  </div>

  <div id="stage">
    <canvas id="cv" width="640" height="880" aria-label="المشهد المجمد. برك و جرّ صبعك باش تذوّب الثلج"></canvas>
    <div id="banner" hidden><h2>ذاب كلشي!</h2><p id="bannerSub">المرحلة الجاية جاية…</p></div>
  </div>

  <div id="shop">
    <div id="shopHead"><strong>حانوت السلاح</strong><span>كلشي فابور، خود لي بغيتي</span></div>
    <div id="tools" role="toolbar" aria-label="السلاح"></div>
  </div>
</div>

<div id="start" dir="rtl" lang="ar">
  <div id="card">
    <h1>سخّنها!</h1>
    <p>الدنيا جمدات. ذوّبو الثلج مجموعين.<br>شكون نتا؟</p>
    <button class="pick" id="pick0" data-n="نورالدين" data-c="0"><i style="background:#ff8a2a"></i>نورالدين</button>
    <button class="pick" id="pick1" data-n="وصال" data-c="1"><i style="background:#ff5fa8"></i>وصال</button>
    <button class="pick" id="pick2" data-n="محمد" data-c="2"><i style="background:#4fe08a"></i>محمد</button>
    <form id="other">
      <input id="nameIn" maxlength="14" placeholder="سمية أخرى" autocomplete="off">
      <button id="go" type="submit">دخل</button>
    </form>
  </div>
</div>

<script>
(() => {
"use strict";
const COLS = 16, ROWS = 22, CS = 20, W = 320, H = 440, N = COLS * ROWS;
const COLORS = ["#ff8a2a", "#ff5fa8", "#4fe08a", "#b78bff"];
const TOOLS = [
  { ic: "🕯️", nm: "شمعة",        was: "0",      r: 1.0, p: 3,  col: "#ffd23f" },
  { ic: "💨", nm: "سيشوار",      was: "50",     r: 1.6, p: 7,  col: "#ffb36b" },
  { ic: "🫖", nm: "براد سخون",   was: "200",    r: 2.0, p: 12, col: "#ffe2b0" },
  { ic: "🔥", nm: "شاليمو",      was: "900",    r: 1.8, p: 24, col: "#ff6a1a" },
  { ic: "⚡", nm: "ليزر",        was: "5 آلاف", r: 1.2, p: 70, col: "#ff3b6b" },
  { ic: "☀️", nm: "شميسة",       was: "20 ألف", r: 3.6, p: 34, col: "#ffe14a" },
  { ic: "💣", nm: "قنبلة سخونة", was: "99 ألف", r: 5.5, p: 0,  col: "#ff9a3c", bomb: true, cd: 1.6 },
];
const SCENES = [
  { nm: "الدار", draw: drawHouse },
  { nm: "الطوموبيل", draw: drawCar },
  { nm: "الطاجين و البراد", draw: drawTajine },
  { nm: "الصاروخ", draw: drawRocket },
];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const S = { name: null, color: 0, lvl: 1, hp: new Float32Array(N), score: 0, tool: 1,
            x: .5, y: .5, firing: false, done: 0, bombN: 0, bx: 0, by: 0, bombAt: -9 };
let room = null, peers = [], parts = [], blasts = [], lastBomb = {}, t0 = 0, clock = 0;
const maxHp = l => 6 * (1 + .35 * (l - 1));
const jit = new Float32Array(N); for (let i = 0; i < N; i++) jit[i] = (Math.sin(i * 12.9898) * 43758.5453) % 1;

/* ---------- state ---------- */
function freeze() { S.hp.fill(maxHp(S.lvl)); S.done = 0; $("banner").hidden = true; }
function encode() { const m = maxHp(S.lvl); let s = ""; for (let i = 0; i < N; i++) s += Math.max(0, Math.min(9, Math.ceil(S.hp[i] / m * 9))); return s; }
function decodeInto(str) { const m = maxHp(S.lvl); for (let i = 0; i < N; i++) { const v = (str.charCodeAt(i) - 48) / 9 * m; if (v >= 0 && v < S.hp[i]) S.hp[i] = v; } }
function adopt(l, h) { if (typeof h !== "string" || h.length !== N) return;
  if (l > S.lvl && l < 1e6) { S.lvl = l; freeze(); decodeInto(h); syncHud(); } else if (l === S.lvl) decodeInto(h); }
function save() { try { localStorage.setItem("sakhenha", JSON.stringify(snap())); } catch (e) {} }
function snap() { return { name: S.name, color: S.color, lvl: S.lvl, h: encode(), score: S.score, tool: S.tool }; }
function restore(d) { if (!d || typeof d !== "object") return;
  if (d.lvl >= 1) { S.lvl = Math.floor(d.lvl); freeze(); if (typeof d.h === "string" && d.h.length === N) decodeInto(d.h); }
  if (d.score > 0) S.score = d.score;
  if (d.tool >= 0 && d.tool < TOOLS.length) S.tool = d.tool;
  if (typeof d.name === "string" && d.name) { S.name = d.name.slice(0, 14); S.color = (d.color | 0) % COLORS.length; } }

/* ---------- melting ---------- */
function burn(px, py, r, amount, mine) {
  const cx = px / CS, cy = py / CS, m = maxHp(S.lvl); let hit = false;
  for (let gy = Math.max(0, Math.floor(cy - r)); gy <= Math.min(ROWS - 1, Math.ceil(cy + r)); gy++)
    for (let gx = Math.max(0, Math.floor(cx - r)); gx <= Math.min(COLS - 1, Math.ceil(cx + r)); gx++) {
      const d = Math.hypot(gx + .5 - cx, gy + .5 - cy); if (d > r) continue;
      const i = gy * COLS + gx; if (S.hp[i] <= 0) continue;
      const take = Math.min(S.hp[i], amount * (1 - .6 * d / r));
      S.hp[i] -= take; hit = true; if (mine) S.score += take / m;
    }
  return hit;
}
function spray(px, py, n, col) {
  for (let k = 0; k < n && parts.length < 160; k++) {
    const steam = Math.random() < .55;
    parts.push({ x: px + (Math.random() - .5) * 16, y: py + (Math.random() - .5) * 12, vx: (Math.random() - .5) * 30,
      vy: steam ? -30 - Math.random() * 40 : 20 + Math.random() * 60, life: .5 + Math.random() * .5, steam, col });
  }
}
function throwBomb(px, py, mine) {
  blasts.push({ x: px, y: py, t: 0 }); spray(px, py, 26, "#ffb36b");
  if (mine) { burn(px, py, TOOLS[6].r, maxHp(S.lvl) * 1.4, true); S.bombN++; S.bx = px / W; S.by = py / H; S.bombAt = clock; }
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function sky(a, b, g) { const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, a); gr.addColorStop(1, b);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); ctx.fillStyle = g; ctx.fillRect(0, 372, W, 68); }
function drawHouse() {
  sky("#7fc4ff", "#d9f0ff", "#c9a36a");
  ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(262, 62, 26, 0, 7); ctx.fill();
  ctx.fillStyle = "#e58a6a"; ctx.fillRect(48, 150, 224, 226);                                  // wall
  ctx.fillStyle = "#c96b4d"; for (let x = 48; x < 272; x += 32) ctx.fillRect(x, 134, 20, 18);   // crenellations
  ctx.fillRect(48, 150, 224, 8);
  ctx.fillStyle = "#1f7a55"; ctx.beginPath(); ctx.moveTo(128, 376); ctx.lineTo(128, 290); ctx.arc(160, 290, 32, Math.PI, 0); ctx.lineTo(192, 376); ctx.fill();
  ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(180, 330, 4, 0, 7); ctx.fill();
  for (const x of [70, 214]) { ctx.fillStyle = "#234a8f"; rr(x, 196, 38, 52, 6); ctx.fill();
    ctx.fillStyle = "#9fd6ff"; ctx.fillRect(x + 6, 202, 26, 40); ctx.fillStyle = "#234a8f"; ctx.fillRect(x + 18, 202, 2, 40); }
  ctx.fillStyle = "#f4e6c8"; for (let x = 60; x < 262; x += 22) { ctx.beginPath(); ctx.moveTo(x, 172); ctx.lineTo(x + 8, 164); ctx.lineTo(x + 16, 172); ctx.lineTo(x + 8, 180); ctx.fill(); }
}
function drawCar() {
  sky("#ffb88a", "#ffe6c4", "#6f7684");
  ctx.fillStyle = "#fff3"; ctx.fillRect(0, 404, W, 4);
  ctx.fillStyle = "#d8262e"; rr(34, 262, 252, 78, 18); ctx.fill();
  ctx.beginPath(); ctx.moveTo(84, 266); ctx.lineTo(112, 204); ctx.lineTo(214, 204); ctx.lineTo(246, 266); ctx.fill();
  ctx.fillStyle = "#bfe9ff"; ctx.beginPath(); ctx.moveTo(100, 262); ctx.lineTo(120, 214); ctx.lineTo(158, 214); ctx.lineTo(158, 262); ctx.fill();
  ctx.beginPath(); ctx.moveTo(166, 262); ctx.lineTo(166, 214); ctx.lineTo(208, 214); ctx.lineTo(230, 262); ctx.fill();
  ctx.fillStyle = "#ffe36b"; rr(40, 280, 16, 14, 4); ctx.fill(); ctx.fillStyle = "#ff9d3c"; rr(266, 280, 14, 14, 4); ctx.fill();
  for (const x of [96, 226]) { ctx.fillStyle = "#1a1d24"; ctx.beginPath(); ctx.arc(x, 344, 30, 0, 7); ctx.fill();
    ctx.fillStyle = "#c9d1dc"; ctx.beginPath(); ctx.arc(x, 344, 13, 0, 7); ctx.fill(); }
}
function drawTajine() {
  sky("#2f6f6a", "#8fd0b8", "#a8552f");
  ctx.fillStyle = "#f6e9d2"; ctx.fillRect(0, 372, W, 6);
  ctx.fillStyle = "#b5451f"; ctx.beginPath(); ctx.ellipse(112, 360, 92, 20, 0, 0, 7); ctx.fill();          // tajine base
  ctx.fillStyle = "#d8622e"; ctx.beginPath(); ctx.moveTo(30, 352); ctx.quadraticCurveTo(70, 250, 112, 170); ctx.quadraticCurveTo(154, 250, 194, 352); ctx.fill();
  ctx.fillStyle = "#f3c14b"; for (const y of [230, 286, 330]) { ctx.fillRect(112 - (y - 150) * .36, y, (y - 150) * .72, 5); }
  ctx.fillStyle = "#b5451f"; ctx.beginPath(); ctx.arc(112, 166, 13, 0, 7); ctx.fill();
  ctx.fillStyle = "#cfd6de"; ctx.beginPath(); ctx.ellipse(246, 322, 42, 46, 0, 0, 7); ctx.fill();          // teapot
  ctx.beginPath(); ctx.moveTo(226, 284); ctx.lineTo(246, 244); ctx.lineTo(266, 284); ctx.fill();
  ctx.strokeStyle = "#cfd6de"; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(288, 318, 20, -1.2, 1.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(210, 322); ctx.quadraticCurveTo(190, 310, 186, 280); ctx.stroke();
  ctx.fillStyle = "#8a96a3"; ctx.beginPath(); ctx.arc(246, 240, 6, 0, 7); ctx.fill();
  ctx.fillStyle = "#7fd08a"; rr(196, 388, 20, 30, 3); ctx.fill(); rr(232, 388, 20, 30, 3); ctx.fill();    // tea glasses
}
function drawRocket() {
  sky("#141a4a", "#4b2a7a", "#5c6377");
  ctx.fillStyle = "#fff"; for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 53) % 360, 2, 2);
  ctx.fillStyle = "#e9eef5"; ctx.beginPath(); ctx.moveTo(160, 60); ctx.quadraticCurveTo(216, 150, 204, 330); ctx.lineTo(116, 330); ctx.quadraticCurveTo(104, 150, 160, 60); ctx.fill();
  ctx.fillStyle = "#e23d3d"; ctx.beginPath(); ctx.moveTo(160, 60); ctx.quadraticCurveTo(190, 104, 196, 140); ctx.lineTo(124, 140); ctx.quadraticCurveTo(130, 104, 160, 60); ctx.fill();
  ctx.beginPath(); ctx.moveTo(116, 260); ctx.lineTo(70, 350); ctx.lineTo(118, 330); ctx.fill();
  ctx.beginPath(); ctx.moveTo(204, 260); ctx.lineTo(250, 350); ctx.lineTo(202, 330); ctx.fill();
  ctx.fillStyle = "#234a8f"; ctx.beginPath(); ctx.arc(160, 200, 26, 0, 7); ctx.fill();
  ctx.fillStyle = "#9fd6ff"; ctx.beginPath(); ctx.arc(160, 200, 18, 0, 7); ctx.fill();
  ctx.fillStyle = "#3b4250"; ctx.fillRect(128, 330, 64, 20);
}
function drawIce() {
  const m = maxHp(S.lvl);
  for (let i = 0; i < N; i++) {
    const a = S.hp[i] / m; if (a <= 0) continue;
    const gx = i % COLS, gy = (i / COLS) | 0, s = CS * (.55 + .45 * a) + 1, o = (CS - s) / 2, j = jit[i];
    ctx.globalAlpha = .45 + .55 * a;
    ctx.fillStyle = j > .25 ? "#cfeeff" : j > -.3 ? "#b4e0fb" : "#a2d4f5";
    if (a > .97) ctx.fillRect(gx * CS, gy * CS, CS + .5, CS + .5); else { rr(gx * CS + o, gy * CS + o, s, s, 5); ctx.fill(); }
    if (j > .55 && a > .4) { ctx.globalAlpha = .7 * a; ctx.fillStyle = "#fff"; ctx.beginPath();
      ctx.moveTo(gx * CS + 4, gy * CS + 13); ctx.lineTo(gx * CS + 13, gy * CS + 4); ctx.lineTo(gx * CS + 15, gy * CS + 6); ctx.lineTo(gx * CS + 6, gy * CS + 15); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawBeam(nx, tx, ty, tool, col, name, me) {
  const T = TOOLS[tool] || TOOLS[0];
  if (!T.bomb) {
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, T.r * CS);
    g.addColorStop(0, T.col); g.addColorStop(1, "#0000");
    ctx.fillStyle = g; ctx.globalAlpha = .55 + .2 * Math.sin(clock * 30);
    ctx.beginPath(); ctx.arc(tx, ty, T.r * CS, 0, 7); ctx.fill();
    ctx.globalAlpha = .8; ctx.strokeStyle = T.col; ctx.lineCap = "round"; ctx.lineWidth = 2 + T.p / 14;
    ctx.beginPath(); ctx.moveTo(nx, H - 6); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  ctx.fillStyle = col; ctx.strokeStyle = "#0a1a31"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(tx, ty, me ? 5 : 4, 0, 7); ctx.fill(); ctx.stroke();
  if (name) { ctx.font = "700 11px Tajawal, sans-serif"; ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeText(name, tx, ty - 10); ctx.fillStyle = "#fff"; ctx.fillText(name, tx, ty - 10); }
}
function nozzleFor(k) { return [60, 260, 110, 210, 30, 290][k % 6]; }

function frame(ts) {
  const dt = Math.min(.05, (ts - t0) / 1000 || 0); t0 = ts; clock += dt;
  const T = TOOLS[S.tool];
  if (S.name && S.firing && !T.bomb && !S.done) {
    if (burn(S.x * W, S.y * H, T.r, T.p * dt, true) && Math.random() < .6) spray(S.x * W, S.y * H, 2, T.col);
  }
  for (const p of peers) {                                   // steam where friends are firing
    const q = p.presence; if (p.isMe || !q || !q.f || q.l !== S.lvl) continue;
    if (Math.random() < .3) spray(q.x * W, q.y * H, 1, "#fff");
  }
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  SCENES[(S.lvl - 1) % SCENES.length].draw();
  drawIce();
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; if (!p.steam) p.vy += 240 * dt;
    ctx.globalAlpha = Math.min(1, p.life * 1.6) * (p.steam ? .5 : .9);
    ctx.fillStyle = p.steam ? "#fff" : "#5ab8ff";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.steam ? 5 + (1 - p.life) * 6 : 2.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i]; b.t += dt; if (b.t > .45) { blasts.splice(i, 1); continue; }
    const k = b.t / .45; ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 1 - k;
    ctx.fillStyle = "#ffb347"; ctx.beginPath(); ctx.arc(b.x, b.y, 20 + k * TOOLS[6].r * CS, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  let k = 0;
  for (const p of peers) {
    const q = p.presence; if (p.isMe || !q || typeof q.n !== "string" || q.l !== S.lvl) continue;
    const col = COLORS[(q.c | 0) % COLORS.length]; const nx = nozzleFor(k++);
    if (q.f) drawBeam(nx, q.x * W, q.y * H, q.t | 0, col, q.n.slice(0, 14), false);
  }
  if (S.name && S.firing) drawBeam(160, S.x * W, S.y * H, S.tool, COLORS[S.color], "", true);

  let left = 0; const m = maxHp(S.lvl); for (let i = 0; i < N; i++) left += Math.max(0, S.hp[i]);
  const pct = Math.floor((1 - left / (N * m)) * 100);
  if (pct !== frame.pct) { frame.pct = pct; $("barFill").style.width = pct + "%"; $("barTxt").textContent = "ذاب " + pct + "%"; $("bar").setAttribute("aria-valuenow", pct); }
  if (left <= 0 && !S.done) { S.done = clock; $("banner").hidden = false; $("bannerSub").textContent = "جاية المرحلة " + (S.lvl + 1) + "…"; }
  if (S.done && clock - S.done > 2.6) { S.lvl++; freeze(); syncHud(); }
  publish(); requestAnimationFrame(frame);
}

/* ---------- multiplayer: everyone publishes the ice they see; lowest ice wins ---------- */
let lastPub = "", lastPubAt = 0, lastChips = "", lastSave = 0;
function publish() {
  if (clock - lastSave > 2) { lastSave = clock; save(); renderChips(); }
  if (!room || !S.name || clock - lastPubAt < .08) return;
  const p = { n: S.name, c: S.color, x: +S.x.toFixed(3), y: +S.y.toFixed(3), f: S.firing ? 1 : 0, t: S.tool,
              l: S.lvl, h: encode(), s: Math.round(S.score), b: S.bombN, bx: +S.bx.toFixed(3), by: +S.by.toFixed(3) };
  const js = JSON.stringify(p); if (js === lastPub) return;
  lastPub = js; lastPubAt = clock; room.presence(p).catch(() => {});
}
function onPeers(ch) {
  peers = ch.peers;
  for (const p of peers) {
    const q = p.presence; if (p.isMe || !q || typeof q.l !== "number") continue;
    adopt(Math.floor(q.l), q.h);
    if (typeof q.b === "number") {
      if (lastBomb[p.peer] !== undefined && q.b > lastBomb[p.peer] && q.l === S.lvl) throwBomb(q.bx * W, q.by * H, false);
      lastBomb[p.peer] = q.b;
    }
  }
  renderChips();
}
function renderChips() {
  const list = []; if (S.name) list.push({ n: S.name + " (نتا)", c: S.color, s: Math.round(S.score) });
  for (const p of peers) { const q = p.presence; if (!p.isMe && q && typeof q.n === "string" && q.n) list.push({ n: q.n.slice(0, 14), c: (q.c | 0) % COLORS.length, s: q.s | 0 }); }
  const key = JSON.stringify(list); if (key === lastChips) return; lastChips = key;
  const box = $("players"); box.textContent = "";
  for (const it of list) { const d = document.createElement("div"); d.className = "chip";
    const i = document.createElement("i"); i.style.background = COLORS[it.c];
    const n = document.createElement("span"); n.textContent = it.n;
    const b = document.createElement("b"); b.textContent = it.s + " ❄";
    d.append(i, n, b); box.append(d); }
  const others = list.length - (S.name ? 1 : 0), net = $("net");
  net.className = room && others > 0 ? "on" : "";
  net.textContent = !room ? "كتلعب بوحدك" : others > 0 ? "كتلعبو " + (others + 1) + " مجموعين" : "كنتسناو صحابك…";
}
function syncHud() { $("lvlName").textContent = "المرحلة " + S.lvl + " · " + SCENES[(S.lvl - 1) % SCENES.length].nm; frame.pct = -1; }

/* ---------- input ---------- */
function aim(e) { const r = cv.getBoundingClientRect();
  S.x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); S.y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); }
cv.addEventListener("pointerdown", e => { if (!S.name) return; e.preventDefault(); aim(e);
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  if (TOOLS[S.tool].bomb) { if (clock - S.bombAt > TOOLS[S.tool].cd && !S.done) throwBomb(S.x * W, S.y * H, true); } else S.firing = true; });
cv.addEventListener("pointermove", e => { if (S.firing) aim(e); });
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) cv.addEventListener(ev, () => { S.firing = false; });
cv.addEventListener("contextmenu", e => e.preventDefault());

function buildTools() {
  const box = $("tools");
  TOOLS.forEach((T, i) => { const b = document.createElement("button"); b.className = "tool"; b.id = "tool" + i; b.type = "button";
    const a = document.createElement("span"); a.className = "ic"; a.textContent = T.ic;
    const n = document.createElement("span"); n.className = "nm"; n.textContent = T.nm;
    const p = document.createElement("span"); p.className = "pr";
    const s = document.createElement("s"); s.textContent = T.was; const em = document.createElement("em"); em.textContent = " فابور";
    p.append(s, em); b.append(a, n, p);
    b.addEventListener("click", () => { S.tool = i; S.firing = false; markTool(); }); box.append(b); });
  markTool();
}
function markTool() { TOOLS.forEach((_, i) => $("tool" + i).setAttribute("aria-pressed", i === S.tool ? "true" : "false")); }
function fit() { const st = $("stage"), w = st.clientWidth, h = st.clientHeight; if (!w || !h) return;
  const s = Math.min(w / W, h / H); cv.style.width = Math.floor(W * s) + "px"; cv.style.height = Math.floor(H * s) + "px"; }
function enter(name, color) { S.name = name.slice(0, 14); S.color = color; $("start").hidden = true; renderChips(); save(); }
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => enter(b.dataset.n, +b.dataset.c)));
$("other").addEventListener("submit", e => { e.preventDefault(); const v = $("nameIn").value.trim(); if (v) enter(v, 3); else $("nameIn").focus(); });

/* ---------- boot ---------- */
function start(hot) {
  freeze();
  let saved = null; try { saved = JSON.parse(localStorage.getItem("sakhenha") || "null"); } catch (e) {}
  restore(hot && hot.lvl ? hot : saved);
  if (hot && hot.name) $("start").hidden = true;      // a live update keeps you in the game; a fresh open asks who you are
  else { S.name = null; }
  buildTools(); syncHud(); renderChips(); fit();
  addEventListener("resize", fit); if (window.ResizeObserver) new ResizeObserver(fit).observe($("stage"));
  requestAnimationFrame(frame);
  if (window.claude && window.claude.use) window.claude.use("room").then(r => {
    if (!r) return; room = r; r.onPeers(onPeers, () => { room = null; peers = []; renderChips(); }); renderChips();
  }).catch(() => {});
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(snap); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
