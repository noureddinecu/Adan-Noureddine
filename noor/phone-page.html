<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f1e">
<meta name="mobile-web-app-capable" content="yes">
<title>Zahhaf TV</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&family=Cairo:wght@800&family=Lalezar&family=Lemonada:wght@700&family=Reem+Kufi:wght@700&display=swap">
<style>
:root{
  --bg:#0d0f1e;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.09);
  --txt:#f5f6ff;--dim:rgba(245,246,255,.62);--a1:#7c5cff;--a2:#00d4ff;--ok:#34d399;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));--r:18px;--ease:cubic-bezier(.2,.8,.2,1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 100% 0%,#2a1f6b 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#0b3b55 0%,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--txt);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.c{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.app .head{display:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 20px rgba(124,92,255,.45)}
.head h1{flex:1;font-size:22px;margin:0;font-weight:800}
.head h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700}

.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{position:relative;z-index:1;flex:1;padding:10px 2px;font-size:13.5px;font-weight:700;border:0;background:none;color:var(--dim);border-radius:12px;transition:color .25s var(--ease)}
.seg button i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}
.seg button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:12px;background:var(--grad);box-shadow:0 4px 16px rgba(124,92,255,.4);transition:transform .35s var(--ease),width .35s var(--ease)}
.panel{display:none}
.panel.on{display:block;animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/22px 22px,#12142a;box-shadow:0 10px 30px rgba(0,0,0,.35)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 1px;border-radius:14px;border:1px solid transparent;background:var(--card2);color:var(--txt);font-size:11.5px;font-weight:600;transition:transform .15s var(--ease),background .2s,border-color .2s}
.tool i{font-style:normal;font-size:21px;line-height:1}
.tool.on{background:rgba(124,92,255,.22);border-color:var(--a1)}
button:active,.tool:active,.chip:active{transform:scale(.95)}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.dot{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);transition:transform .2s var(--ease),box-shadow .2s}
.dot.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.picker{position:relative;flex:none;width:34px;height:34px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.picker input{position:absolute;inset:-10px;opacity:0;width:60px;height:60px}
.font{flex:none;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:20px;transition:all .2s}
.font.on{border-color:var(--a2);background:rgba(0,212,255,.15)}
.lbl{font-size:13px;color:var(--dim);margin:2px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.size{display:flex;align-items:center;gap:12px}
.size input{flex:1;accent-color:var(--a1)}
.prev{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.prev span{display:block;border-radius:50%;background:#fff;transition:all .15s}
.stk{display:none;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.stk.on{display:grid;animation:in .3s var(--ease)}
.stk span{font-size:28px;text-align:center;padding:6px 0;border-radius:10px;transition:transform .15s}
.stk span:active{transform:scale(1.3);background:var(--card2)}
.saved{flex:none;width:120px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#12142a}
.saved img{display:block;width:120px;height:68px;object-fit:cover;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/12px 12px}
.saved div{display:flex}
.saved button{flex:1;padding:6px 0;border:0;background:var(--card2);color:#fff;font-size:15px}
.chips{display:flex;gap:6px}
.chip{flex:1;padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;transition:all .2s var(--ease)}
.chip.on{background:rgba(0,212,255,.18);border-color:var(--a2)}
.big{width:100%;margin-top:14px;padding:17px;font-size:19px;font-weight:800;border:0;border-radius:var(--r);background:var(--grad);color:#fff;
  box-shadow:0 10px 26px rgba(124,92,255,.45);transition:transform .15s var(--ease)}
.row{display:flex;gap:8px;margin-top:10px}
.sec{flex:1;padding:13px 6px;font-size:14px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);transition:transform .15s var(--ease)}
.sec.red{color:#ffd0da;border-color:rgba(255,107,138,.35);background:rgba(255,107,138,.1)}
textarea{width:100%;height:150px;font-size:22px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--txt);resize:none;
  font-family:inherit;outline:none;transition:border-color .2s;-webkit-user-select:text;user-select:text}
textarea:focus{border-color:var(--a1)}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.6}
.hide{display:none!important}
.pr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;margin-top:8px;background:var(--card2);border:1px solid transparent;font-size:18px;font-weight:700;transition:all .3s}
.pr span:last-child{font-variant-numeric:tabular-nums;font-size:22px}
.pr.next{background:rgba(124,92,255,.22);border-color:var(--a1);box-shadow:0 6px 20px rgba(124,92,255,.25)}
.count{text-align:center;font-size:15px;color:var(--dim);margin:6px 0 2px}
.count b{display:block;font-size:34px;color:#fff;font-variant-numeric:tabular-nums;margin-top:4px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--card2);border:1px solid var(--line);transition:background .25s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;top:3px;left:4px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked+span{background:var(--grad)}
.sw input:checked+span:before{transform:translateX(21px)}
.tv{position:relative;aspect-ratio:16/9;border-radius:14px;border:2px solid var(--line);background:#12142a;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;direction:ltr}
.tv button{border-radius:10px;border:1px dashed var(--line);background:none;transition:all .25s var(--ease)}
.tv button.on{border:1px solid var(--a2);background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(0,212,255,.25))}
.tv button:nth-child(1){align-self:start;justify-self:start;width:60%;height:45%}.tv button:nth-child(2){align-self:start;justify-self:end;width:60%;height:45%}
.tv button:nth-child(3){align-self:end;justify-self:start;width:60%;height:45%}.tv button:nth-child(4){align-self:end;justify-self:end;width:60%;height:45%}

.ic{width:1.2em;height:1.2em;flex:none;display:block}
i[data-i]{font-style:normal;display:inline-grid;place-items:center}
.seg button i .ic{width:22px;height:22px;margin:0 auto 3px}
.tool i .ic{width:24px;height:24px}
.logo .ic{width:24px;height:24px;color:#fff}
.lang{display:inline-flex;align-items:center;gap:6px}
.big,.sec{display:flex;align-items:center;justify-content:center;gap:9px}
.big .ic{width:22px;height:22px}
.lbl span:first-child{display:inline-flex;align-items:center;gap:7px}
.lbl .ic{width:18px;height:18px;color:var(--a2)}
.dim{color:var(--dim)}
.dim .ic{width:22px;height:22px}
.tvi{position:absolute;inset:0;opacity:.3;pointer-events:none}.tvi .ic{width:34px;height:34px}
.saved button{display:grid;place-items:center}.saved .ic{width:18px;height:18px}
.pr span:first-child{display:inline-flex;align-items:center;gap:10px}.pr .ic{width:22px;height:22px;color:var(--a2)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:rgba(20,22,44,.95);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .35s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="c">
<div class="head"><div class="logo"><i data-i="tv"></i></div><h1><b data-t="name1">زحاف</b> TV</h1><button class="lang" onclick="toggleLang()" id="langb"><i data-i="globe"></i><span>ES</span></button></div>

<div class="seg" id="seg">
  <div class="pill" id="pill"></div>
  <button class="on" onclick="tab(0)"><i data-i="palette"></i><span data-t="tStudio"></span></button>
  <button onclick="tab(1)"><i data-i="message"></i><span data-t="tMsg"></span></button>
  <button onclick="tab(2)"><i data-i="live"></i><span data-t="tLive"></span></button>
  <button onclick="tab(3)"><i data-i="moon"></i><span data-t="tPray"></span></button>
</div>

<!-- Studio -->
<section class="panel on" id="p0">
  <div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div class="card">
    <div class="grid">
      <button class="tool on" id="m-pen" onclick="mode('pen')"><i data-i="pen"></i><span data-t="pen"></span></button>
      <button class="tool" id="m-move" onclick="mode('move')"><i data-i="move"></i><span data-t="move"></span></button>
      <button class="tool" onclick="addText()"><i data-i="text"></i><span data-t="text"></span></button>
      <button class="tool" id="m-stk" onclick="toggleStk()"><i data-i="smile"></i><span data-t="sticker"></span></button>
      <button class="tool" onclick="pick('cam')"><i data-i="camera"></i><span data-t="camera"></span></button>
      <button class="tool" onclick="pick('bg')"><i data-i="image"></i><span data-t="bg"></span></button>
      <button class="tool" onclick="pick('item')"><i data-i="imageplus"></i><span data-t="photo"></span></button>
      <button class="tool" onclick="saveIt()"><i data-i="save"></i><span data-t="save"></span></button>
      <button class="tool" onclick="undo()"><i data-i="undo"></i><span data-t="undo"></span></button>
      <button class="tool" id="m-del" onclick="delSel()"><i data-i="trash"></i><span data-t="del"></span></button>
    </div>
    <div class="stk" id="stk"></div>
  </div>
  <div class="card">
    <div class="lbl"><span data-t="color"></span></div>
    <div class="scroll" id="colors"></div>
    <div id="fontbox" class="hide"><div class="lbl" style="margin-top:6px"><span data-t="font"></span></div><div class="scroll" id="fonts"></div></div>
    <div class="lbl" style="margin-top:6px"><span id="szl"></span></div>
    <div class="size"><input type="range" id="sz" min="4" max="60" value="12" oninput="size(this.value)"><div class="prev"><span id="pv"></span></div></div>
  </div>
  <div class="row">
    <button class="sec" onclick="wipeText()" data-t="wText" data-i="textx"></button>
    <button class="sec" onclick="wipeLines()" data-t="wLines" data-i="eraser"></button>
    <button class="sec red" onclick="wipe()" data-t="wAll" data-i="trash"></button>
  </div>
  <div class="card">
    <div class="lbl"><span data-t="howLong"></span></div>
    <div class="chips" id="dur">
      <button class="chip" data-v="15" data-t="d15"></button><button class="chip on" data-v="60" data-t="d60"></button>
      <button class="chip" data-v="300" data-t="d300"></button><button class="chip" data-v="0" data-t="d0"></button>
    </div>
  </div>
  <button class="big" onclick="sendPic()" data-t="sendTv" data-i="send"></button>
  <div class="row"><button class="sec red" onclick="hidePic()" data-t="hidePic" data-i="eyeoff"></button></div>
  <div class="card" id="savedCard"><div class="lbl"><span data-t="savedT" data-i="bookmark"></span></div><div class="scroll" id="savedList"></div></div>
  <p class="hint" data-t="hintStudio"></p>
</section>

<!-- Quick message -->
<section class="panel" id="p1">
  <textarea id="t" maxlength="200"></textarea>
  <button class="big" onclick="sendText()" data-t="send" data-i="send"></button>
  <div class="row"><button class="sec red" onclick="hideText()" data-t="hideText" data-i="eyeoff"></button></div>
  <p class="hint" data-t="hintMsg"></p>
</section>

<!-- Live drawing -->
<section class="panel" id="p2">
  <div class="stage"><canvas id="lv"></canvas></div>
  <div class="card"><div class="lbl"><span data-t="color"></span></div><div class="scroll" id="lcolors"></div></div>
  <div class="row"><button class="sec red" onclick="lclr()" data-t="clearLive" data-i="eraser"></button></div>
  <p class="hint" data-t="hintLive"></p>
</section>

<!-- Prayer -->
<section class="panel" id="p3">
  <div class="card">
    <div class="count"><span data-t="nextIn"></span> <span id="nextName"></span><b id="countdown">--:--:--</b></div>
    <div id="plist"></div>
  </div>
  <div class="row">
    <button class="sec" onclick="adhan('do=play')" data-t="tryAdhan" data-i="play"></button>
    <button class="sec red" onclick="adhan('do=stop')" data-t="stopAdhan" data-i="stop"></button>
  </div>
  <div class="card">
    <div class="lbl"><span data-t="adhanVol" data-i="vol"></span><span id="volv"></span></div>
    <div class="size"><i data-i="vollow" class="dim"></i><input type="range" id="vol" min="0" max="100" value="100" oninput="$('volv').textContent=this.value+'%'" onchange="adhan('vol='+this.value)"><i data-i="vol" class="dim"></i></div>
  </div>
  <div class="card">
    <div class="lbl"><span data-t="dhikrT" data-i="sparkles" style="font-size:15px;color:#fff;font-weight:700"></span>
      <label class="sw"><input type="checkbox" id="dOn" onchange="dset('on='+(this.checked?1:0))"><span></span></label></div>
    <div id="dBox">
      <div class="lbl" style="margin-top:8px"><span data-t="dEvery"></span></div>
      <div class="chips" id="dEvery"><button class="chip" data-v="5">5</button><button class="chip" data-v="10">10</button><button class="chip" data-v="15">15</button><button class="chip" data-v="30">30</button><button class="chip" data-v="60">60</button></div>
      <div class="lbl" style="margin-top:12px"><span data-t="dSecs"></span></div>
      <div class="chips" id="dSecs"><button class="chip" data-v="5">5</button><button class="chip" data-v="8">8</button><button class="chip" data-v="12">12</button><button class="chip" data-v="20">20</button></div>
      <div class="lbl" style="margin-top:12px"><span data-t="dCorner"></span></div>
      <div class="tv"><button data-v="tl"></button><button data-v="tr"></button><button data-v="bl"></button><button data-v="br"></button><i data-i="tv" class="tvi"></i></div>
      <div class="row"><button class="sec" onclick="dset('do=test')" data-t="dTest" data-i="eye"></button></div>
    </div>
  </div>
  <p class="hint" data-t="hintPray"></p>
</section>

<input type="file" id="file" accept="image/*" class="hide">
<input type="file" id="cam" accept="image/*" capture="environment" class="hide">
</div>
<div class="toast" id="toast"></div>

setInterval(function(){if(!PT||!PT.times.length)return;var hm=PT.times[PT.next].split(':'),now=new Date(),t=new Date();t.setHours(+hm[0],+hm[1],0,0);
  if(t<now)t.setDate(t.getDate()+1);var s=Math.floor((t-now)/1000);if(s<=0){loadPrayer();return}
  $('countdown').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(function(x){return('0'+x).slice(-2)}).join(':')},1000);
/* ---------- adhkar on screen ---------- */
function chipsSet(id,v){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('on',b.dataset.v==String(v))})}
['dEvery','dSecs'].forEach(function(id){document.querySelectorAll('#'+id+' button').forEach(function(b){b.onclick=function(){chipsSet(id,b.dataset.v);
  dset((id==='dEvery'?'every=':'secs=')+b.dataset.v)}})});
document.querySelectorAll('.tv button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tv button').forEach(function(x){x.classList.toggle('on',x===b)});dset('corner='+b.dataset.v+'&do=test')}});
function dload(){fetch('/dhikr').then(function(r){return r.json()}).then(function(j){$('dOn').checked=j.on;$('dBox').style.opacity=j.on?1:.4;chipsSet('dEvery',j.every);chipsSet('dSecs',j.secs);
  document.querySelectorAll('.tv button').forEach(function(x){x.classList.toggle('on',x.dataset.v===j.corner)})}).catch(function(){})}
function dset(q){if(q.indexOf('on=')===0)$('dBox').style.opacity=q==='on=1'?1:.4;
  post('/dhikr?'+q,'').then(function(){say(q.indexOf('do=test')>=0?'dShow':q==='on=1'?'dOn':q==='on=0'?'dOff':'dSaved')}).catch(function(){say('wifi')})}

function adhan(q){post('/adhan?'+q,'').then(function(){say(q==='do=play'?'adhanPlay':q==='do=stop'?'adhanStop':'volSet')}).catch(function(){say('wifi')})}

icons();setLang(lang);prev();draw();renderSaved();setTimeout(function(){placePill(0)},0);
</script>
