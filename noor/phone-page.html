<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f1e">
<meta name="mobile-web-app-capable" content="yes">
<title>زحاف TV</title>
<style>
:root{
  --bg:#0d0f1e;--bg2:#15122e;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.09);
  --txt:#f5f6ff;--dim:rgba(245,246,255,.62);--a1:#7c5cff;--a2:#00d4ff;--ok:#34d399;--warn:#ff6b8a;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));--r:18px;--ease:cubic-bezier(.2,.8,.2,1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 100% 0%,#2a1f6b 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#0b3b55 0%,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--txt);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.c{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.app .head{display:none}
.head{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 20px rgba(124,92,255,.45)}
.head h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.3px}
.head h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* segmented tabs with a sliding pill */
.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px;backdrop-filter:blur(10px)}
.seg button{position:relative;z-index:1;flex:1;padding:11px 4px;font-size:15px;font-weight:700;border:0;background:none;color:var(--dim);border-radius:12px;transition:color .25s var(--ease)}
.seg button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;border-radius:12px;background:var(--grad);box-shadow:0 4px 16px rgba(124,92,255,.4);transition:transform .35s var(--ease),width .35s var(--ease)}
.panel{display:none}
.panel.on{display:block;animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/22px 22px,#12142a;box-shadow:0 10px 30px rgba(0,0,0,.35)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:1px solid transparent;background:var(--card2);color:var(--txt);font-size:12px;font-weight:600;transition:transform .15s var(--ease),background .2s,border-color .2s}
.tool i{font-style:normal;font-size:22px;line-height:1}
.tool.on{background:rgba(124,92,255,.22);border-color:var(--a1)}
button:active,.tool:active,.chip:active{transform:scale(.95)}
.colors{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.colors::-webkit-scrollbar{display:none}
.dot{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);transition:transform .2s var(--ease),box-shadow .2s}
.dot.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.picker{position:relative;flex:none;width:34px;height:34px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.picker input{position:absolute;inset:-10px;opacity:0;width:60px;height:60px}
.lbl{font-size:13px;color:var(--dim);margin:2px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.size{display:flex;align-items:center;gap:12px}
.size input{flex:1;accent-color:var(--a1)}
.prev{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.prev span{display:block;border-radius:50%;background:#fff;transition:all .15s}
.stk{display:none;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.stk.on{display:grid;animation:in .3s var(--ease)}
.stk span{font-size:28px;text-align:center;padding:6px 0;border-radius:10px;transition:transform .15s}
.stk span:active{transform:scale(1.3);background:var(--card2)}
.chips{display:flex;gap:6px}
.chip{flex:1;padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;transition:all .2s var(--ease)}
.chip.on{background:rgba(0,212,255,.18);border-color:var(--a2)}
.big{width:100%;margin-top:14px;padding:17px;font-size:19px;font-weight:800;border:0;border-radius:var(--r);background:var(--grad);color:#fff;
  box-shadow:0 10px 26px rgba(124,92,255,.45);transition:transform .15s var(--ease),filter .2s}
.big:active{filter:brightness(1.1)}
.row{display:flex;gap:8px;margin-top:10px}
.sec{flex:1;padding:13px 6px;font-size:14px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);transition:transform .15s var(--ease)}
.sec.red{color:#ffd0da;border-color:rgba(255,107,138,.35);background:rgba(255,107,138,.1)}
textarea{width:100%;height:150px;font-size:22px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--txt);resize:none;
  font-family:inherit;outline:none;transition:border-color .2s;-webkit-user-select:text;user-select:text}
textarea:focus{border-color:var(--a1)}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.6}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:rgba(20,22,44,.95);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .35s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="c">
<div class="head"><div class="logo">📺</div><h1><b>زحاف</b> TV</h1></div>

<div class="seg" id="seg">
  <div class="pill" id="pill"></div>
  <button class="on" onclick="tab(0)">🎨 استوديو</button>
  <button onclick="tab(1)">✍️ رسالة</button>
  <button onclick="tab(2)">✏️ مباشر</button>
</div>

<!-- Studio: draw, write, stickers and photos, sent to the TV as one picture -->
<section class="panel on" id="p0">
  <div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div class="card">
    <div class="grid">
      <button class="tool on" id="m-pen" onclick="mode('pen')"><i>✏️</i>قلم</button>
      <button class="tool" id="m-move" onclick="mode('move')"><i>✋</i>حرّك</button>
      <button class="tool" onclick="addText()"><i>🔤</i>نص</button>
      <button class="tool" id="m-stk" onclick="toggleStk()"><i>😀</i>ستيكر</button>
      <button class="tool" onclick="pick('bg')"><i>🖼️</i>خلفية</button>
      <button class="tool" onclick="pick('item')"><i>📷</i>صورة</button>
      <button class="tool" onclick="undo()"><i>↩️</i>رجوع</button>
      <button class="tool" id="m-del" onclick="delSel()"><i>🗑️</i>حيد</button>
    </div>
    <div class="stk" id="stk"></div>
  </div>
  <div class="card">
    <div class="lbl"><span>اللون</span></div>
    <div class="colors" id="colors"></div>
    <div class="lbl" style="margin-top:6px"><span id="szl">السُمك</span></div>
    <div class="size"><input type="range" id="sz" min="4" max="60" value="12" oninput="size(this.value)"><div class="prev"><span id="pv"></span></div></div>
  </div>
  <div class="row">
    <button class="sec" onclick="wipeText()">🔤 مسح الكتابة</button>
    <button class="sec" onclick="wipeLines()">✏️ مسح الرسم</button>
    <button class="sec red" onclick="wipe()">🧹 مسح الكل</button>
  </div>
  <div class="card">
    <div class="lbl"><span>شحال تبقى فالتلفزيون؟</span></div>
    <div class="chips" id="dur">
      <button class="chip" data-v="15">١٥ ث</button><button class="chip on" data-v="60">دقيقة</button>
      <button class="chip" data-v="300">٥ د</button><button class="chip" data-v="0">حتى نحيدها</button>
    </div>
  </div>
  <button class="big" onclick="sendPic()">📤 صيفط للتلفزيون</button>
  <div class="row"><button class="sec red" onclick="hidePic()">✖️ حيد التصويرة من التلفزيون</button></div>
  <p class="hint">بلا خلفية، الرسم كيبان فوق اللي خدام فالتلفزيون · ✋ «حرّك» باش تجرّ وتكبّر النص والستيكر والصورة</p>
</section>

<!-- Quick message -->
<section class="panel" id="p1">
  <textarea id="t" maxlength="200" placeholder="كتب هنا... ✨"></textarea>
  <button class="big" onclick="sendText()">📤 صيفط</button>
  <div class="row"><button class="sec red" onclick="hideText()">🧹 حيد الكتابة من التلفزيون</button></div>
  <p class="hint">الكتابة كتبان فوسط التلفزيون ٢٠ ثانية، ولا حتى تحيدها.</p>
</section>

<!-- Live drawing -->
<section class="panel" id="p2">
  <div class="stage"><canvas id="lv"></canvas></div>
  <div class="card"><div class="lbl"><span>اللون</span></div><div class="colors" id="lcolors"></div></div>
  <div class="row"><button class="sec red" onclick="lclr()">🧹 مسح الرسم من التلفزيون</button></div>
  <p class="hint">الرسم كيبان فالتلفزيون فنفس اللحظة، وكيمشي ١٥ ثانية من بعد آخر خط.</p>
</section>

<input type="file" id="file" accept="image/*" class="hide">
</div>
<div class="toast" id="toast"></div>

<script>
function $(i){return document.getElementById(i)}
if(/ZahhafApp/.test(navigator.userAgent))document.body.classList.add('app');
var tt;function say(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},2600)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
document.addEventListener('click',function(e){if(e.target.closest('button,.dot,.stk span'))buzz()},true);
function post(u,b){return fetch(u,{method:'POST',body:b})}

/* tabs with a sliding pill */
var tabs=document.querySelectorAll('#seg button');
function placePill(n){var b=tabs[n],s=$('seg');$('pill').style.width=b.offsetWidth+'px';$('pill').style.transform='translateX('+(b.offsetLeft-4)+'px)';$('pill').style.left='4px'}
function tab(n){tabs.forEach(function(b,i){b.classList.toggle('on',i===n)});for(var i=0;i<3;i++)$('p'+i).classList.toggle('on',i===n);placePill(n);if(n===2)setTimeout(lfit,30)}
window.addEventListener('resize',function(){tabs.forEach(function(b,i){if(b.classList.contains('on'))placePill(i)})});
setTimeout(function(){placePill(0)},0);

/* palette: shared by the studio and live drawing */
var PALETTE=['#ffffff','#000000','#9ca3af','#ff3b30','#ff6b8a','#ff9500','#ffcc00','#f5c542','#a3e635','#34c759','#10b981','#00d4ff','#3b82f6','#1e3a8a','#7c5cff','#c084fc','#ec4899','#8b5a2b'];
function palette(id,onPick){var box=$(id);PALETTE.forEach(function(c,i){var d=document.createElement('div');d.className='dot'+(i?'':' on');d.style.background=c;
    d.onclick=function(){choose(box,d);onPick(c)};box.appendChild(d)});
  var p=document.createElement('label');p.className='picker';var inp=document.createElement('input');inp.type='color';inp.value='#7c5cff';
  inp.oninput=function(){choose(box,null);p.style.boxShadow='0 0 0 3px var(--bg),0 0 0 5px '+inp.value;onPick(inp.value)};p.appendChild(inp);box.appendChild(p)}
function choose(box,d){box.querySelectorAll('.dot').forEach(function(x){x.classList.remove('on')});box.querySelector('.picker').style.boxShadow='';if(d)d.classList.add('on')}

/* ---------- Studio ---------- */
var W=1280,H=720,cv=$('cv'),cx=cv.getContext('2d');
var STICKERS=['🕌','🌙','⭐','✨','🤲','📿','📖','❤️','💚','💜','🌹','🌸','🌷','💐','☕','🍵','🎂','🎉','🎁','🎈','👍','👏','🙏','😍','😂','🥰','😘','😎','🤗','🥳','👶','🏠','☀️','🌈','🐱','⚽'];
var col='#ffffff',thick=12,tool='pen',bg=null,ops=[],sel=null,drag=null,cur=null;
palette('colors',function(c){col=c;if(sel&&sel.k==='text'){sel.color=c;draw()}prev()});
STICKERS.forEach(function(s){var e=document.createElement('span');e.textContent=s;e.onclick=function(){addItem({k:'stk',t:s,x:W/2,y:H/2,s:160})};$('stk').appendChild(e)});
document.querySelectorAll('#dur .chip').forEach(function(b){b.onclick=function(){document.querySelectorAll('#dur .chip').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}});
function dur(){return document.querySelector('#dur .chip.on').dataset.v}
function prev(){var s=Math.max(4,Math.min(40,tool==='move'&&sel?16:thick));$('pv').style.width=s+'px';$('pv').style.height=s+'px';$('pv').style.background=col}

function mode(m){tool=m;$('m-pen').classList.toggle('on',m==='pen');$('m-move').classList.toggle('on',m==='move');
  if(m==='pen'){select(null);$('szl').textContent='السُمك';$('sz').min=4;$('sz').max=60;$('sz').value=thick}prev();draw()}
function toggleStk(){$('stk').classList.toggle('on');$('m-stk').classList.toggle('on')}
function size(v){v=+v;if(tool==='move'&&sel){sel.s=v;draw()}else{thick=v;prev()}}
function select(it){sel=it;$('m-del').classList.toggle('on',!!it);
  if(it){$('szl').textContent='الحجم';$('sz').min=20;$('sz').max=it.k==='img'?1280:400;$('sz').value=it.s}draw()}
function addItem(it){ops.push(it);$('stk').classList.remove('on');$('m-stk').classList.remove('on');mode('move');select(it)}
function addText(){var t=prompt('شنو بغيتي تكتب؟');if(t&&t.trim())addItem({k:'text',t:t.trim(),x:W/2,y:H/2,s:90,color:col})}
function undo(){var it=ops.pop();if(!it){say('ما بقا والو');return}if(it===sel)select(null);draw()}
function delSel(){if(!sel){say('اختار شي حاجة بـ ✋ الأول');return}ops.splice(ops.indexOf(sel),1);select(null)}
function wipeText(){var n=ops.length;ops=ops.filter(function(o){return o.k!=='text'});if(sel&&sel.k==='text')select(null);draw();say(n>ops.length?'تمسحات الكتابة 🔤':'ما كاين حتى كتابة')}
function wipeLines(){var n=ops.length;ops=ops.filter(function(o){return o.k!=='line'});draw();say(n>ops.length?'تمسح الرسم ✏️':'ما كاين حتى رسم')}
function wipe(){if(!ops.length&&!bg)return;if(!confirm('نمسحو كلشي؟'))return;ops=[];bg=null;select(null);draw();say('تمسح كلشي 🧹')}

function pick(kind){var f=$('file');f.value='';f.onchange=function(){var file=f.files[0];if(!file)return;
  var url=URL.createObjectURL(file),im=new Image();im.onload=function(){
    if(kind==='bg'){bg=im;say('تزادت الخلفية 🖼️')}else{addItem({k:'img',im:im,x:W/2,y:H/2,s:Math.min(560,im.width)})}draw()};im.src=url};f.click()}

function fontFor(it){return (it.k==='text'?'800 ':'')+it.s+'px -apple-system,system-ui,"Noto Color Emoji",sans-serif'}
function itemBox(it){
  if(it.k==='img'){var h=it.s*it.im.height/it.im.width;return[it.x-it.s/2,it.y-h/2,it.s,h]}
  cx.font=fontFor(it);var w=cx.measureText(it.t).width;return[it.x-w/2,it.y-it.s*0.6,w,it.s*1.2]}
function draw(){
  cx.clearRect(0,0,W,H);
  if(bg){var r=Math.max(W/bg.width,H/bg.height),w=bg.width*r,h=bg.height*r;cx.drawImage(bg,(W-w)/2,(H-h)/2,w,h)}
  ops.forEach(function(o){
    if(o.k==='line'){cx.strokeStyle=o.c;cx.lineWidth=o.w;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();
      o.p.forEach(function(p,i){i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])});if(o.p.length===1)cx.lineTo(o.p[0][0]+0.1,o.p[0][1]);cx.stroke()}
    else if(o.k==='img'){var b=itemBox(o);cx.drawImage(o.im,b[0],b[1],b[2],b[3])}
    else{cx.font=fontFor(o);cx.textAlign='center';cx.textBaseline='middle';
      if(o.k==='text'){cx.lineWidth=Math.max(4,o.s/10);cx.lineJoin='round';cx.strokeStyle=lum(o.color)<.35?'rgba(255,255,255,.9)':'rgba(0,0,0,.7)';cx.strokeText(o.t,o.x,o.y);cx.fillStyle=o.color}
      else cx.fillStyle='#fff';
      cx.fillText(o.t,o.x,o.y)}
  });
  if(sel){var b=itemBox(sel);cx.save();cx.setLineDash([14,10]);cx.strokeStyle='#00d4ff';cx.lineWidth=4;cx.strokeRect(b[0]-10,b[1]-10,b[2]+20,b[3]+20);cx.restore()}
}
function lum(h){var n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function hit(p){for(var i=ops.length-1;i>=0;i--){var o=ops[i];if(o.k==='line')continue;var b=itemBox(o);
  if(p[0]>=b[0]-24&&p[0]<=b[0]+b[2]+24&&p[1]>=b[1]-24&&p[1]<=b[1]+b[3]+24)return o}return null}
var raf=0;function redraw(){if(!raf)raf=requestAnimationFrame(function(){raf=0;draw()})}
cv.onpointerdown=function(e){cv.setPointerCapture(e.pointerId);var p=pt(e);
  if(tool==='pen'){cur={k:'line',c:col,w:thick,p:[p]};ops.push(cur);redraw()}
  else{var it=hit(p);select(it);if(it){drag=[p[0]-it.x,p[1]-it.y];buzz()}}};
cv.onpointermove=function(e){var p=pt(e);if(cur){cur.p.push(p);redraw()}else if(drag&&sel){sel.x=p[0]-drag[0];sel.y=p[1]-drag[1];redraw()}};
cv.onpointerup=cv.onpointercancel=function(){cur=null;drag=null};

function sendPic(){
  if(!ops.length&&!bg){say('رسم ولا زيد شي حاجة الأول 🙂');return}
  var keep=sel;sel=null;draw();var type=bg?'image/jpeg':'image/png';
  cv.toBlob(function(b){sel=keep;draw();say('كيتصيفط… ⏳');
    post('/image?s='+dur(),b).then(function(r){return r.text()}).then(function(t){say(t==='ok'?'بانت فالتلفزيون ✅':'ما بانتش، عاود جرّب')})
    .catch(function(){say('ما وصلاتش، تأكد من الواي فاي 📶')})},type,0.85)}
function hidePic(){post('/hide','').then(function(){say('تحيدات التصويرة ✖️')}).catch(function(){say('ما وصلاتش 📶')})}
prev();draw();

/* ---------- Quick message ---------- */
function sendText(){var t=$('t');if(!t.value.trim()){say('كتب شي حاجة الأول ✍️');return}post('/send',t.value).then(function(){say('وصلات ✅');t.value=''})
  .catch(function(){say('ما وصلاتش، عاود جرّب 📶')})}
function hideText(){post('/hidetext','').then(function(){say('تحيدات الكتابة 🧹')}).catch(function(){say('ما وصلاتش 📶')})}

/* ---------- Live drawing (the TV's /draw format) ---------- */
var lv=$('lv'),lx=lv.getContext('2d'),lcol='#ffffff',q=[],last=null,cont=false;
palette('lcolors',function(c){lcol=c});
function lfit(){var r=lv.getBoundingClientRect();if(r.width)lv.width=r.width*2,lv.height=r.height*2}
function lpt(e){var r=lv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function lline(a,b){lx.strokeStyle=lcol;lx.lineWidth=6;lx.lineCap='round';lx.beginPath();lx.moveTo(a[0]*lv.width,a[1]*lv.height);lx.lineTo(b[0]*lv.width,b[1]*lv.height);lx.stroke()}
lv.onpointerdown=function(e){lv.setPointerCapture(e.pointerId);last=lpt(e);cont=false;q=[last]};
lv.onpointermove=function(e){if(!last)return;var p=lpt(e);lline(last,p);last=p;q.push(p)};
lv.onpointerup=lv.onpointercancel=function(){lflush();last=null};
function lflush(){if(q.length<1)return;var s=(cont?'+':'')+lcol+' '+q.map(function(p){return p[0].toFixed(4)+','+p[1].toFixed(4)}).join(' ');
  if(last){q=[last];cont=true}else q=[];post('/draw',s)}
setInterval(function(){if(last&&q.length>1)lflush()},80);
function lclr(){lx.clearRect(0,0,lv.width,lv.height);post('/clear','').then(function(){say('تمسح الرسم 🧹')})}
</script>
</body>
