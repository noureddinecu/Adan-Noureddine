<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f1e">
<meta name="mobile-web-app-capable" content="yes">
<title>Zahhaf TV</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="gf">
<style>
:root{--bg:#0d0f1e;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.09);
  --txt:#f5f6ff;--dim:rgba(245,246,255,.62);--a1:#7c5cff;--a2:#00d4ff;--ok:#34d399;--bad:#ff6b8a;--grad:linear-gradient(135deg,var(--a1),var(--a2));--r:18px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 100% 0%,#2a1f6b 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#0b3b55 0%,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--txt);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.c{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.i3{width:26px;height:26px;flex:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.head{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.app .head{display:none}
.head .i3{width:40px;height:40px}
.head h1{flex:1;font-size:22px;margin:0;font-weight:800}
.head h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700}
.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:12px}
.seg button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 4px;font-size:14.5px;font-weight:800;border:0;background:none;color:var(--dim);border-radius:14px;transition:color .25s var(--ease)}
.seg button.on{color:#fff}
.seg .i3{width:32px;height:32px;transition:transform .35s var(--ease)}
.seg button.on .i3{transform:scale(1.12) rotate(-6deg)}
.pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:14px;background:var(--grad);box-shadow:0 4px 16px rgba(124,92,255,.4);transition:transform .35s var(--ease),width .35s var(--ease)}
.panel{display:none}.panel.on{display:block;animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* live bar: state, how long, pen sound */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.live{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:800}
.live i{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(255,107,138,.6)}
.live.ok i{background:var(--ok);animation:pulse 1.6s infinite}
.live.flash i{background:#fff;box-shadow:0 0 12px #fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}100%{box-shadow:0 0 0 10px rgba(52,211,153,0)}}
.mini{display:flex;gap:4px;flex:1;justify-content:flex-end}
.mini button{padding:6px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:12px;font-weight:700;transition:all .2s}
.mini button.on{color:#fff;border-color:var(--a2);background:rgba(0,212,255,.16)}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.icon .i3{width:24px;height:24px}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/22px 22px,#12142a;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.stage.black{background:#000}
canvas{width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:2px 2px 12px}
.title .i3{width:30px;height:30px}
.lbl{font-size:14px;color:var(--dim);margin:2px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.lbl>span:first-child{display:inline-flex;align-items:center;gap:8px}
.lbl .i3{width:22px;height:22px}
.scroll{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.dot{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);transition:transform .2s var(--ease),box-shadow .2s}
.dot.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.picker{position:relative;flex:none;width:34px;height:34px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.picker input{position:absolute;inset:-10px;opacity:0;width:60px;height:60px}
.preset{flex:none;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14.5px;font-weight:700;white-space:nowrap}
.emo{flex:none;font-size:26px;padding:4px 6px;border-radius:10px;background:none;border:0}
.fonts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:236px;overflow-y:auto;padding:2px}
.fh{grid-column:1/-1;font-size:12.5px;color:var(--dim);margin:6px 2px 0}
.font{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:19px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s var(--ease)}
.font small{display:block;font:11px system-ui;opacity:.55;margin-top:2px}
.font.on{border-color:var(--a2);background:rgba(0,212,255,.15);box-shadow:0 0 0 1px var(--a2)}
.size{display:flex;align-items:center;gap:12px}.size input{flex:1;accent-color:var(--a1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:60px;padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:700;transition:all .2s var(--ease)}
.chip.on{background:rgba(0,212,255,.18);border-color:var(--a2)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:14px;border:1px solid transparent;background:var(--card2);color:var(--txt);font-size:12px;font-weight:700;transition:all .2s var(--ease)}
.tool .i3{width:30px;height:30px}
.tool.on{background:rgba(124,92,255,.24);border-color:var(--a1)}
.shapes{display:none;gap:8px;margin-top:10px}.shapes.on{display:flex;animation:in .3s var(--ease)}
.shape{flex:1;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:22px}
.shape.on{border-color:var(--a2);background:rgba(0,212,255,.16)}
.toggles{display:flex;flex-direction:column;gap:10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:700}
.tg>span{display:inline-flex;align-items:center;gap:9px}.tg .i3{width:24px;height:24px}
button:active,.chip:active,.font:active,.key:active,.tool:active{transform:scale(.94)}
textarea{width:100%;height:96px;font-size:20px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--txt);resize:none;
  font-family:inherit;outline:none;transition:border-color .2s;-webkit-user-select:text;user-select:text;margin-top:12px}
textarea:focus{border-color:var(--a1)}
.row{display:flex;gap:8px;margin-top:10px}
.sec{flex:1;padding:12px 6px;font-size:14.5px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease)}
.sec.red{color:#ffd0da;border-color:rgba(255,107,138,.35);background:rgba(255,107,138,.1)}
.sec.big{padding:15px;font-size:17px}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.6}
.hide{display:none!important}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--card2);border:1px solid var(--line);transition:background .25s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;top:3px;left:4px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked+span{background:var(--grad)}.sw input:checked+span:before{transform:translateX(21px)}
.tv{position:relative;aspect-ratio:16/9;border-radius:14px;border:2px solid var(--line);background:#12142a;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;direction:ltr}
.tv button{border-radius:10px;border:1px dashed var(--line);background:none;transition:all .25s var(--ease);width:60%;height:45%}
.tv button.on{border:1px solid var(--a2);background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(0,212,255,.25))}
.tv button:nth-child(1){align-self:start;justify-self:start}.tv button:nth-child(2){align-self:start;justify-self:end}
.tv button:nth-child(3){align-self:end;justify-self:start}.tv button:nth-child(4){align-self:end;justify-self:end}
.tv .i3{position:absolute;inset:0;margin:auto;width:46px;height:46px;opacity:.5;pointer-events:none}
/* full-screen drawing */
.full{position:fixed;inset:0;z-index:15;background:#05060d;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 0}
.full .stage{width:min(100vw,calc(100vh * 16 / 9));max-height:100vh;border-radius:0;border:0}
.fbar{display:none;position:fixed;z-index:16;top:10px;left:50%;transform:translateX(-50%);gap:8px;padding:6px;border-radius:16px;background:rgba(20,22,44,.85);border:1px solid var(--line);backdrop-filter:blur(10px)}
.fbar.on{display:flex}
.fbar .dot{width:28px;height:28px}
/* PIN pad */
.pin{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,7,16,.72);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.pin.on{opacity:1;pointer-events:auto}
.pbox{width:min(88vw,340px);padding:22px 20px;border-radius:26px;background:linear-gradient(180deg,rgba(40,34,90,.95),rgba(16,18,40,.95));border:1px solid var(--line);
  box-shadow:0 30px 60px rgba(0,0,0,.5);text-align:center;transform:translateY(20px) scale(.96);transition:transform .35s var(--ease)}
.pin.on .pbox{transform:none}
.pbox .i3{width:58px;height:58px}
.pbox h3{margin:10px 0 16px;font-size:19px}
.dots{display:flex;justify-content:center;gap:16px;margin-bottom:20px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:all .2s var(--ease)}
.dots i.f{background:var(--grad);border-color:transparent;transform:scale(1.15)}
.dots.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.key{height:58px;border-radius:18px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:24px;font-weight:700;display:grid;place-items:center;transition:transform .12s var(--ease)}
.key .i3{width:30px;height:30px}
.key.ghost{background:none;border:0;font-size:15px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:30;
  background:rgba(20,22,44,.95);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .35s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="c">
<div class="head"><img class="i3" data-k="tv" alt=""><h1><b data-t="name1">زحاف</b> TV</h1><button class="lang" onclick="toggleLang()" id="langb"><img class="i3" data-k="globe" alt=""><span>ES</span></button></div>

<div class="seg" id="seg">
  <div class="pill"></div>
  <button class="on" onclick="tab(0)"><img class="i3" data-k="written" alt=""><span data-t="tWrite"></span></button>
  <button onclick="tab(1)"><img class="i3" data-k="drawn" alt=""><span data-t="tDraw"></span></button>
  <button onclick="tab(2)"><img class="i3" data-k="gear" alt=""><span data-t="tSet"></span></button>
</div>

<!-- live state, how long it stays, the pen sound: shared by writing and drawing -->
<div class="bar" id="liveBar">
  <span class="live" id="live"><i></i><span data-t="offline"></span></span>
  <div class="mini" id="dur"><button data-v="15" data-t="d15"></button><button data-v="60" data-t="d60" class="on"></button><button data-v="0" data-t="d0"></button></div>
  <button class="icon" id="sndb" onclick="toggleSound()"><img class="i3" data-k="vol" alt="" id="sndi"></button>
</div>

<!-- Page 1: live writing -->
<section class="panel on" id="p0">
  <div class="stage"><canvas id="cvW" width="1280" height="720"></canvas></div>
  <textarea id="t" maxlength="160"></textarea>
  <div class="scroll" id="emos"></div>
  <div class="row">
    <button class="sec" onclick="wUndo()"><img class="i3" data-k="undo" alt=""><span data-t="undo"></span></button>
    <button class="sec" onclick="wRedo()"><img class="i3" data-k="redo" alt=""><span data-t="redo"></span></button>
    <button class="sec red" onclick="wClear()"><img class="i3" data-k="sponge" alt=""><span data-t="clear"></span></button>
  </div>
  <div class="card"><div class="lbl"><span><img class="i3" data-k="presets" alt=""><span data-t="presets"></span></span></div><div class="scroll" id="presets"></div></div>
  <div class="card"><div class="lbl"><span><img class="i3" data-k="font" alt=""><span data-t="font"></span></span><span id="fname"></span></div><div class="fonts" id="fonts"></div></div>
  <div class="card">
    <div class="lbl"><span><img class="i3" data-k="color" alt=""><span data-t="color"></span></span></div>
    <div class="scroll" id="tcolors"></div>
    <div class="lbl" style="margin-top:8px"><span data-t="look"></span></div>
    <div class="chips" id="look"><button class="chip" data-v="none" data-t="lNone"></button><button class="chip on" data-v="dark" data-t="lDark"></button><button class="chip" data-v="grad" data-t="lGrad"></button><button class="chip" data-v="light" data-t="lLight"></button></div>
    <div class="lbl" style="margin-top:12px"><span><img class="i3" data-k="frame" alt=""><span data-t="frameL"></span></span></div>
    <div class="chips" id="frame"><button class="chip on" data-v="none" data-t="fNone"></button><button class="chip" data-v="gold" data-t="fGold"></button><button class="chip" data-v="islamic" data-t="fIslamic"></button><button class="chip" data-v="hearts" data-t="fHearts"></button></div>
    <div class="lbl" style="margin-top:12px"><span><img class="i3" data-k="pin" alt=""><span data-t="posL"></span></span></div>
    <div class="chips" id="pos"><button class="chip" data-v="top" data-t="pTop"></button><button class="chip on" data-v="center" data-t="pCenter"></button><button class="chip" data-v="bottom" data-t="pBottom"></button><button class="chip" data-v="ticker" data-t="pTicker"></button></div>
    <div class="lbl" style="margin-top:12px"><span><img class="i3" data-k="size" alt=""><span data-t="sizeL"></span></span></div>
    <div class="size"><input type="range" id="tsz" min="40" max="170" value="96"></div>
    <div class="tg" style="margin-top:14px"><span><img class="i3" data-k="keyboard" alt=""><span data-t="typewriter"></span></span><label class="sw"><input type="checkbox" id="tw" checked><span></span></label></div>
  </div>
</section>

<!-- Page 2: live drawing -->
<section class="panel" id="p1">
  <div id="dwrap"><div class="stage" id="dstage"><canvas id="cvD" width="1280" height="720"></canvas></div></div>
  <div class="fbar" id="fbar"></div>
  <div class="row">
    <button class="sec" onclick="dUndo()"><img class="i3" data-k="undo" alt=""><span data-t="undo"></span></button>
    <button class="sec" onclick="dRedo()"><img class="i3" data-k="redo" alt=""><span data-t="redo"></span></button>
    <button class="sec red" onclick="dClear()"><img class="i3" data-k="sponge" alt=""><span data-t="clear"></span></button>
  </div>
  <div class="card">
    <div class="tools" id="tools">
      <button class="tool on" data-v="pen"><img class="i3" data-k="pen" alt=""><span data-t="tPen"></span></button>
      <button class="tool" data-v="neon"><img class="i3" data-k="neon" alt=""><span data-t="tNeon"></span></button>
      <button class="tool" data-v="spray"><img class="i3" data-k="spray" alt=""><span data-t="tSpray"></span></button>
      <button class="tool" data-v="eraser"><img class="i3" data-k="sponge" alt=""><span data-t="tEraser"></span></button>
      <button class="tool" data-v="shape"><img class="i3" data-k="shapes" alt=""><span data-t="tShape"></span></button>
      <button class="tool" onclick="goFull()"><img class="i3" data-k="full" alt=""><span data-t="tFull"></span></button>
    </div>
    <div class="shapes" id="shapes"><button class="shape on" data-v="circle">◯</button><button class="shape" data-v="rect">▢</button><button class="shape" data-v="heart">♡</button><button class="shape" data-v="star">☆</button><button class="shape" data-v="arrow">➜</button></div>
  </div>
  <div class="card">
    <div class="lbl"><span><img class="i3" data-k="color" alt=""><span data-t="color"></span></span></div>
    <div class="scroll" id="pcolors"></div>
    <div class="lbl" style="margin-top:8px"><span><img class="i3" data-k="pen" alt=""><span data-t="thick"></span></span></div>
    <div class="size"><input type="range" id="psz" min="4" max="48" value="12"></div>
  </div>
  <div class="card toggles">
    <div class="tg"><span><img class="i3" data-k="fountain" alt=""><span data-t="natural"></span></span><label class="sw"><input type="checkbox" id="nat" checked><span></span></label></div>
    <div class="tg"><span><img class="i3" data-k="fade" alt=""><span data-t="fadeL"></span></span><label class="sw"><input type="checkbox" id="fadeOn"><span></span></label></div>
    <div class="tg"><span><img class="i3" data-k="frame" alt=""><span data-t="blackL"></span></span><label class="sw"><input type="checkbox" id="black" onchange="$('dstage').classList.toggle('black',this.checked);dSend(true)"><span></span></label></div>
  </div>
  <p class="hint" data-t="hintDraw"></p>
</section>

<!-- Page 3: TV settings, behind the PIN -->
<section class="panel" id="p2">
  <div class="card">
    <div class="title"><img class="i3" data-k="prayer" alt=""><span data-t="adhanT"></span></div>
    <div class="row" style="margin-top:0">
      <button class="sec" onclick="adhan('do=play')"><img class="i3" data-k="play" alt=""><span data-t="tryAdhan"></span></button>
      <button class="sec red" onclick="adhan('do=stop')"><img class="i3" data-k="stop" alt=""><span data-t="stopAdhan"></span></button>
    </div>
    <div class="lbl" style="margin-top:14px"><span><img class="i3" data-k="vol" alt=""><span data-t="adhanVol"></span></span><span id="volv"></span></div>
    <div class="size"><img class="i3" data-k="vollow" alt=""><input type="range" id="vol" min="0" max="100" value="100" oninput="$('volv').textContent=this.value+'%'" onchange="adhan('vol='+this.value)"><img class="i3" data-k="vol" alt=""></div>
  </div>
  <div class="card">
    <div class="tg"><span style="font-size:16px;font-weight:800"><img class="i3" data-k="bell" alt="" style="width:30px;height:30px"><span data-t="chimeL"></span></span>
      <label class="sw"><input type="checkbox" id="chime" onchange="dset('chime='+(this.checked?1:0))"><span></span></label></div>
  </div>
  <div class="card">
    <div class="lbl" style="margin-bottom:4px"><span class="title" style="margin:0;color:#fff"><img class="i3" data-k="beads" alt=""><span data-t="dhikrT"></span></span>
      <label class="sw"><input type="checkbox" id="dOn" onchange="dset('on='+(this.checked?1:0))"><span></span></label></div>
    <div id="dBox">
      <div class="lbl" style="margin-top:10px"><span data-t="dEvery"></span></div>
      <div class="chips" id="dEvery"><button class="chip" data-v="5">5</button><button class="chip" data-v="10">10</button><button class="chip" data-v="15">15</button><button class="chip" data-v="30">30</button><button class="chip" data-v="60">60</button></div>
      <div class="lbl" style="margin-top:12px"><span data-t="dSecs"></span></div>

  ls.forEach(function(l,i){var ty=y+size*.3+lh*(i+.5);if(look==='none'){cx.lineWidth=Math.max(4,size/9);cx.lineJoin='round';cx.strokeStyle='rgba(0,0,0,.65)';cx.strokeText(l,x+bw/2,ty)}
    cx.fillStyle=tcol;cx.fillText(l,x+bw/2,ty)})}
function star8(cx,x,y,r){cx.beginPath();for(var i=0;i<16;i++){var a=i*Math.PI/8,d=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d)}cx.closePath();cx.fill()}
var strip=document.createElement('canvas'),sx=strip.getContext('2d');
function layout(){var text=shownText.trim()?shownText:'',size=+$('tsz').value,pos=val('pos');
  var cx=cxw;cx.font=size+'px "'+font+'",system-ui,sans-serif';var rtl=/[؀-ۿ]/.test(text||T('sample'));cx.direction=rtl?'rtl':'ltr';
  var ls=pos==='ticker'?[(text||T('sample')).replace(/\n/g,'  ·  ')]:wrap(cx,text||T('sample'),W*.8),lh=size*1.35,w=0;ls.forEach(function(l){w=Math.max(w,cx.measureText(l).width)});
  var bw=w+size*1.2,bh=ls.length*lh+size*.6;return{text:text,size:size,pos:pos,rtl:rtl,ls:ls,lh:lh,bw:bw,bh:bh}}
function drawW(){var o=layout(),cx=cxw;cx.clearRect(0,0,W,H);cx.globalAlpha=o.text?1:.35;
  var x=(W-o.bw)/2,y=o.pos==='top'?50:o.pos==='bottom'||o.pos==='ticker'?H-o.bh-50:(H-o.bh)/2;
  if(o.pos==='ticker')x=o.rtl?40:W-o.bw-40;
  card(cx,o.ls,o.size,o.lh,x,y,o.bw,o.bh);cx.globalAlpha=1;return o}
function wSend(){var o=drawW();if(!o.text){clearTv();return}
  if(o.pos==='ticker'){strip.width=Math.ceil(o.bw+40);strip.height=Math.ceil(o.bh+40);sx.clearRect(0,0,strip.width,strip.height);sx.direction=o.rtl?'rtl':'ltr';
    card(sx,o.ls,o.size,o.lh,20,20,o.bw,o.bh);frame(strip,'&pos=ticker'+(o.rtl?'&dir=rtl':''))}
  else frame(cw,'')}

/* ================= page 2: live drawing ================= */
var cd=$('cvD'),cxd=cd.getContext('2d'),items=[],redo=[],cur=null,pcol='#ffffff',tool='pen',shape='circle',last=null,lastT=0,fadeRaf=0;
var FADE_MS=4000;
palette($('pcolors'),function(c){pcol=c});
document.querySelectorAll('#tools .tool[data-v]').forEach(function(b){b.onclick=function(){document.querySelectorAll('#tools .tool[data-v]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');tool=b.dataset.v;$('shapes').classList.toggle('on',tool==='shape')}});
chips('shapes',function(v){shape=v});
function pt(e){var r=cd.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function shapePath(cx,s,a,b){var x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]),cxp=x+w/2,cyp=y+h/2;cx.beginPath();
  if(s==='circle')cx.ellipse(cxp,cyp,w/2,h/2,0,0,Math.PI*2);else if(s==='rect')rr(cx,x,y,w,h,Math.min(18,w/4,h/4));
  else if(s==='heart'){cx.moveTo(cxp,y+h*.3);cx.bezierCurveTo(cxp,y,x,y,x,y+h*.35);cx.bezierCurveTo(x,y+h*.65,cxp,y+h*.85,cxp,y+h);cx.bezierCurveTo(cxp,y+h*.85,x+w,y+h*.65,x+w,y+h*.35);cx.bezierCurveTo(x+w,y,cxp,y,cxp,y+h*.3)}
  else if(s==='star'){for(var i=0;i<10;i++){var an=-Math.PI/2+i*Math.PI/5,rr2=i%2?.4:1;cx.lineTo(cxp+Math.cos(an)*w/2*rr2,cyp+Math.sin(an)*h/2*rr2)}cx.closePath()}
  else{var ang=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=Math.min(60,Math.hypot(w,h)/3);cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);
    cx.moveTo(b[0]-hl*Math.cos(ang-.45),b[1]-hl*Math.sin(ang-.45));cx.lineTo(b[0],b[1]);cx.lineTo(b[0]-hl*Math.cos(ang+.45),b[1]-hl*Math.sin(ang+.45))}}
function paint(cx,o,now){var alpha=1;if(o.fade){var age=now-o.end;if(o.end&&age>0)alpha=Math.max(0,1-age/FADE_MS)}if(alpha<=0)return;cx.save();cx.globalAlpha=alpha;
  if(o.k==='eraser'){if($('black').checked)cx.strokeStyle='#000';else{cx.globalCompositeOperation='destination-out';cx.strokeStyle='#000'}}else cx.strokeStyle=o.c;
  cx.lineCap='round';cx.lineJoin='round';
  if(o.k==='neon'){cx.shadowColor=o.c;cx.shadowBlur=o.w*2.2}
  if(o.k==='spray'){cx.fillStyle=o.c;o.p.forEach(function(p){cx.fillRect(p[0],p[1],2.4,2.4)})}
  else if(o.k==='shape'){cx.lineWidth=o.w;shapePath(cx,o.s,o.a,o.b);cx.stroke()}
  else if(o.k==='neon'){cx.lineWidth=o.w;line(cx,o.p);cx.stroke();cx.shadowBlur=0;cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=Math.max(2,o.w*.35);line(cx,o.p);cx.stroke()}
  else{for(var i=1;i<o.p.length;i++){cx.lineWidth=o.p[i][2]||o.w;cx.beginPath();cx.moveTo(o.p[i-1][0],o.p[i-1][1]);cx.lineTo(o.p[i][0],o.p[i][1]);cx.stroke()}
    if(o.p.length===1){cx.lineWidth=o.w;cx.beginPath();cx.moveTo(o.p[0][0],o.p[0][1]);cx.lineTo(o.p[0][0]+.1,o.p[0][1]);cx.stroke()}}
  cx.restore()}
function line(cx,p){cx.beginPath();p.forEach(function(q,i){i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])})}
function drawD(){var now=performance.now();cxd.clearRect(0,0,W,H);if($('black').checked){cxd.fillStyle='#000';cxd.fillRect(0,0,W,H)}items.forEach(function(o){paint(cxd,o,now)})}
function dSend(force){drawD();if(!items.length&&!$('black').checked){clearTv();return}frame(cd,'')}
var sendT=0;function dTick(){var now=Date.now();if(now-sendT>110){sendT=now;dSend()}}
cd.onpointerdown=function(e){cd.setPointerCapture(e.pointerId);var p=pt(e),w=+$('psz').value;redo=[];last=p;lastT=performance.now();
  if(tool==='shape')cur={k:'shape',s:shape,c:pcol,w:w,a:p,b:p,fade:$('fadeOn').checked};
  else cur={k:tool,c:pcol,w:tool==='eraser'?w*2.5:w,p:tool==='spray'?[]:[p.concat(w)],fade:$('fadeOn').checked};
  items.push(cur);if(tool==='spray')spray(p,w);scratchStart();drawD();dTick()};
cd.onpointermove=function(e){if(!cur)return;var p=pt(e),now=performance.now(),dist=Math.hypot(p[0]-last[0],p[1]-last[1]),v=dist/Math.max(1,now-lastT)*16;
  scratchSpeed(v);
  if(cur.k==='shape')cur.b=p;else if(cur.k==='spray')spray(p,cur.w);
  else{var w=cur.w;if($('nat').checked&&cur.k==='pen'){var prev=cur.p[cur.p.length-1][2]||w;w=Math.max(cur.w*.35,Math.min(cur.w*1.4,cur.w*1.5-v*.9));w=prev*.6+w*.4}cur.p.push([p[0],p[1],w])}
  last=p;lastT=now;drawD();dTick()};
cd.onpointerup=cd.onpointercancel=function(){if(!cur)return;cur.end=performance.now();cur=null;scratchStop();dSend();if($('fadeOn').checked)fadeLoop()};
function spray(p,w){var r=w*2.2;for(var i=0;i<w*2.5;i++){var a=Math.random()*Math.PI*2,d=Math.random()*r;cur.p.push([p[0]+Math.cos(a)*d,p[1]+Math.sin(a)*d])}}
/* fading strokes keep the TV in step until they are gone */
function fadeLoop(){cancelAnimationFrame(fadeRaf);var lastSend=0;(function step(){var now=performance.now();
  items=items.filter(function(o){return !(o.fade&&o.end&&now-o.end>FADE_MS)});drawD();
  if(now-lastSend>160){lastSend=now;if(items.length||$('black').checked)frame(cd,'');else clearTv()}
  if(items.some(function(o){return o.fade}))fadeRaf=requestAnimationFrame(step)})()}
function dUndo(){var o=items.pop();if(!o){say('nothing');return}redo.push(o);dSend()}
function dRedo(){var o=redo.pop();if(!o)return;items.push(o);dSend()}
function dClear(){items=[];redo=[];drawD();clearTv();say('cleared')}
/* full screen: the canvas fills the phone, turned sideways if the phone allows it */
function goFull(){var w=$('dwrap');w.classList.add('full');var fb=$('fbar');fb.classList.add('on');fb.innerHTML='';
  var close=document.createElement('button');close.className='icon';close.innerHTML='<img class="i3" src="'+(ICONS.hide||'')+'">';close.onclick=exitFull;fb.appendChild(close);
  var u=document.createElement('button');u.className='icon';u.innerHTML='<img class="i3" src="'+(ICONS.undo||'')+'">';u.onclick=dUndo;fb.appendChild(u);
  var c=document.createElement('button');c.className='icon';c.innerHTML='<img class="i3" src="'+(ICONS.sponge||'')+'">';c.onclick=dClear;fb.appendChild(c);
  var pal=document.createElement('div');pal.style.display='flex';pal.style.gap='6px';pal.style.alignItems='center';palette(pal,function(cc){pcol=cc},true);fb.appendChild(pal);
  try{document.documentElement.requestFullscreen().then(function(){return screen.orientation.lock('landscape')}).catch(function(){})}catch(e){}
  if(innerHeight>innerWidth)say('rotate')}
function exitFull(){$('dwrap').classList.remove('full');$('fbar').classList.remove('on');try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}

/* ================= page 3: adhan, chime and adhkar on the TV ================= */
function adhan(q){post('/adhan?'+q,'').then(function(){say(q==='do=play'?'adhanPlay':q==='do=stop'?'adhanStop':'volSet')}).catch(function(){say('wifi')})}
function chipsSet(id,v){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('on',b.dataset.v==String(v))})}
['dEvery','dSecs'].forEach(function(id){document.querySelectorAll('#'+id+' button').forEach(function(b){b.onclick=function(){chipsSet(id,b.dataset.v);dset((id==='dEvery'?'every=':'secs=')+b.dataset.v)}})});
document.querySelectorAll('.tv button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tv button').forEach(function(x){x.classList.toggle('on',x===b)});dset('corner='+b.dataset.v+'&do=test')}});
function dload(){fetch('/dhikr').then(function(r){return r.json()}).then(function(j){$('dOn').checked=j.on;$('chime').checked=j.chime!==false;$('dBox').style.opacity=j.on?1:.4;chipsSet('dEvery',j.every);chipsSet('dSecs',j.secs);
  document.querySelectorAll('.tv button').forEach(function(x){x.classList.toggle('on',x.dataset.v===j.corner)})}).catch(function(){});
  fetch('/prayer').then(function(r){return r.json()}).then(function(j){$('vol').value=j.vol;$('volv').textContent=j.vol+'%'}).catch(function(){})}
function dset(q){if(q.indexOf('on=')===0)$('dBox').style.opacity=q==='on=1'?1:.4;
  post('/dhikr?'+q,'').then(function(){say(q.indexOf('do=test')>=0?'dShow':q==='on=1'?'dOn':q==='on=0'?'dOff':q==='chime=1'?'chimeOn':q==='chime=0'?'chimeOff':'dSaved')}).catch(function(){say('wifi')})}

setIcons();if(!sound)$('sndi').src=ICONS.mute||'';setLang(lang);drawD();ping();document.fonts.ready.then(drawW);setTimeout(pills,0);
