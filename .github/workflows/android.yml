name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: android
        env:
          # Optional: set these repository secrets to sign with your own private key instead of android/app/release.jks
          LQG_STORE_PASSWORD: ${{ secrets.LQG_STORE_PASSWORD }}
          LQG_KEY_PASSWORD: ${{ secrets.LQG_KEY_PASSWORD }}
        run: |
          [ -z "$LQG_STORE_PASSWORD" ] && unset LQG_STORE_PASSWORD
          [ -z "$LQG_KEY_PASSWORD" ] && unset LQG_KEY_PASSWORD
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../LIVE-QUIZ-GAME-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LIVE-QUIZ-GAME-apk
          path: LIVE-QUIZ-GAME-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: LIVE QUIZ GAME — Android v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: LIVE-QUIZ-GAME-*.apk
          body: |
            تطبيق LIVE QUIZ GAME لأندرويد (Android 7.0 فما فوق).
            حمّل ملف APK أدناه على هاتفك، ثم افتحه واسمح بالتثبيت من مصادر غير معروفة إذا طلب الهاتف ذلك.
            يحتاج التطبيق إلى رابط خادم اللعبة (على الإنترنت، أو Termux على نفس الهاتف، أو جهاز على نفس الشبكة).
