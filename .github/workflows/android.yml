name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release (R8 minified) bundle + APKs
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload debug APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-debug-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Collect APKs for release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/VideoDownloader-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk dist/VideoDownloader-armeabi-v7a.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/VideoDownloader-x86_64.apk

      - name: Publish test build as GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Video Downloader test build ${{ github.run_number }}
          prerelease: true
          body: |
            Test build (debug-signed) from commit ${{ github.sha }}.
            Most phones: download **VideoDownloader-arm64-v8a.apk**. Older 32-bit phones: armeabi-v7a.
          files: dist/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
