# One-click deploy on Render (https://render.com) — works from a phone browser.
services:
  - type: web
    name: goldrail-relay-eu
    runtime: node
    region: frankfurt          # Europe: close to Morocco (the old service was in Oregon, USA)
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: ACCESS_TOKEN
        generateValue: true
      - key: EULER_API_KEY
        sync: false
